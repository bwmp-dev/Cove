name: Publish dashboard and workers
on:
  workflow_call:
    inputs:
      channel:
        required: true
        type: string
      version:
        required: true
        type: string
      revision:
        required: true
        type: string
      publish:
        required: true
        type: boolean
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        target: [panel, worker]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
          TARGET: ${{ matrix.target }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          if [ "$TARGET" = worker ]; then image="$image-worker"; fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "schema=$(sha256sum internal/control/schema.sql | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "revision_time=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "generation=$(git rev-list --first-parent --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "root=$(git rev-list --first-parent --max-parents=0 HEAD)" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.4
        if: inputs.publish
      - name: Sign bundled executables
        if: inputs.publish
        env:
          VERSION: ${{ inputs.version }}
          REVISION: ${{ inputs.revision }}
          CHANNEL: ${{ inputs.channel }}
          REVISION_TIME: ${{ steps.names.outputs.revision_time }}
          SOURCE_GENERATION: ${{ steps.names.outputs.generation }}
          SOURCE_ROOT: ${{ steps.names.outputs.root }}
        run: |
          for arch in amd64 arm64; do
            docker buildx build --target binaries --platform "linux/$arch" --build-arg "BUILD_VERSION=$VERSION" --build-arg "BUILD_REVISION=$REVISION" --build-arg "BUILD_CHANNEL=$CHANNEL" --build-arg "BUILD_REVISION_TIME=$REVISION_TIME" --build-arg "BUILD_SOURCE_GENERATION=$SOURCE_GENERATION" --build-arg "BUILD_SOURCE_ROOT=$SOURCE_ROOT" --output "type=local,dest=/tmp/cove-binaries-$arch" .
            cosign sign-blob --yes --bundle "release-signatures/cove-linux-$arch.sigstore.json" "/tmp/cove-binaries-$arch/cove"
          done
          for arch in amd64 arm64; do
            cosign sign-blob --yes --bundle "release-signatures/cove-worker-linux-$arch.sigstore.json" "/tmp/cove-binaries-amd64/cove-worker-linux-$arch"
          done
          chmod 0644 release-signatures/*.sigstore.json
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          push: ${{ inputs.publish }}
          tags: ${{ steps.names.outputs.image }}:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.revision }}
            org.opencontainers.image.version=${{ inputs.version }}
            io.cove.schema-sha256=${{ steps.names.outputs.schema }}
            io.cove.revision-time=${{ steps.names.outputs.revision_time }}
            io.cove.source-generation=${{ steps.names.outputs.generation }}
            io.cove.source-root=${{ steps.names.outputs.root }}
          build-args: |
            BUILD_VERSION=${{ inputs.version }}
            BUILD_REVISION=${{ inputs.revision }}
            BUILD_CHANNEL=${{ inputs.channel }}
            BUILD_REVISION_TIME=${{ steps.names.outputs.revision_time }}
            BUILD_SOURCE_GENERATION=${{ steps.names.outputs.generation }}
            BUILD_SOURCE_ROOT=${{ steps.names.outputs.root }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - name: Sign published image index
        if: inputs.publish
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
  promote:
    needs: images
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@v4.1.4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote complete builds to the selected channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ inputs.revision }}
          VERSION: ${{ inputs.version }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = beta ]; then
            head=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
            [ "$head" = "$REVISION" ] || { echo 'A newer main commit exists; keeping this build under its immutable tag.'; exit 0; }
          else
            latest=$(gh api "repos/$REPOSITORY/releases/latest" --jq .tag_name)
            [ "$latest" = "$VERSION" ] || { echo 'A newer release exists; keeping this build under its version tag.'; exit 0; }
          fi
          for suffix in '' '-worker'; do
            image="ghcr.io/${REPOSITORY,,}$suffix"
            docker buildx imagetools create --tag "$image:$CHANNEL" "$image:$VERSION"
            cosign sign --yes "$image:$CHANNEL"
          done
