entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  traefik:
    address: "127.0.0.1:8080"
api:
  insecure: true
  dashboard: false
ping: {}
providers:
  file:
    directory: /data/dynamic
    watch: true
certificatesResolvers:
  cove:
    acme:
      storage: /data/traefik-acme.json
      httpChallenge:
        entryPoint: web
